<section class="container py-4">
  <h1>Usuarios</h1>

  <mat-spinner *ngIf="cargando"></mat-spinner>
  <p *ngIf="error" class="alert alert-danger">{{ error }}</p>

  <table *ngIf="!cargando && !error" mat-table [dataSource]="usuarios" class="mat-elevation-z2 w-100">
    <ng-container matColumnDef="nombreUsuario">
      <th mat-header-cell *matHeaderCellDef>Usuario</th>
      <td mat-cell *matCellDef="let usuario">{{ usuario.nombreUsuario }}</td>
    </ng-container>
    <ng-container matColumnDef="correo">
      <th mat-header-cell *matHeaderCellDef>Correo</th>
      <td mat-cell *matCellDef="let usuario">{{ usuario.correo }}</td>
    </ng-container>
    <ng-container matColumnDef="roles">
      <th mat-header-cell *matHeaderCellDef>Roles</th>
      <td mat-cell *matCellDef="let usuario">{{ usuario.roles?.join(', ') }}</td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="['nombreUsuario', 'correo', 'roles']"></tr>
    <tr mat-row *matRowDef="let row; columns: ['nombreUsuario', 'correo', 'roles'];"></tr>
  </table>
</section>
