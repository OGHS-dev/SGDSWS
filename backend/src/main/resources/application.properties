# Runtime configuration is supplied through environment variables.
server.port=${SERVER_PORT:8081}

# OracleDB connection settings
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@//localhost:1521/XEPDB1}
spring.datasource.username=${DB_USERNAME:SGDSWS}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Set SPRING_DATASOURCE_PASSWORD in the runtime environment.

# JPA settings
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.open-in-view=false

# JWT settings
security.jwt.secret-key=${JWT_SECRET_KEY}
security.jwt.expiration-time=${JWT_EXPIRATION_TIME:300000}

# Multipart upload limits
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:10MB}

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}
